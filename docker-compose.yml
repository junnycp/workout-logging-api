services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: workouts
      POSTGRES_PASSWORD: workouts
      POSTGRES_DB: workouts
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workouts -d workouts"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: .
      target: migrate
    environment:
      DATABASE_URL: postgresql://workouts:workouts@postgres:5432/workouts
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Optional performance dataset (docs/PERFORMANCE.md), never started by a plain `docker compose up`:
  #   docker compose --profile perf run --rm seed-perf                                       # ~150k entries
  #   docker compose --profile perf run --rm seed-perf node dist/cli/seed-perf.js --include-optional
  # Built on the migrate stage, which has the dev dependencies the perf scripts need.
  seed-perf:
    profiles: [perf]
    build:
      context: .
      target: migrate
    command: ["node", "dist/cli/seed-perf.js"]
    environment:
      DATABASE_URL: postgresql://workouts:workouts@postgres:5432/workouts
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: "no"

  api:
    build:
      context: .
      target: runtime
    environment:
      NODE_ENV: production
      PORT: 3000
      LOG_LEVEL: info
      DATABASE_URL: postgresql://workouts:workouts@postgres:5432/workouts
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
